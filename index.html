<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Özel Sürpriz</title>
  
  <!-- Three.js Library & Confetti -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #ff477e;
      --gold: #ffb703;
      --bg: #070913;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: #fff;
    }

    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .ui-layer {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 20px;
      pointer-events: none;
    }

    .interactive {
      pointer-events: auto;
    }

    header {
      text-align: center;
      background: rgba(13, 15, 23, 0.55);
      backdrop-filter: blur(12px);
      padding: 20px 32px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff477e 0%, #ffbe0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    p.sub {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .countdown-bar {
      display: flex;
      gap: 16px;
      margin-top: 14px;
      justify-content: center;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      min-width: 65px;
    }

    .time-box .num {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--gold);
      display: block;
    }

    .time-box .lbl {
      font-size: 0.65rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    footer {
      text-align: center;
      margin-bottom: 20px;
    }

    .btn-blow {
      background: linear-gradient(135deg, #ff477e, #ffaa00);
      border: none;
      color: white;
      padding: 16px 36px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 71, 126, 0.4);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-blow:hover {
      transform: scale(1.05) translateY(-3px);
      box-shadow: 0 15px 40px rgba(255, 71, 126, 0.6);
    }

    .btn-blow:disabled {
      background: rgba(255, 255, 255, 0.1);
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .letter-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      opacity: 0;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 183, 3, 0.3);
      padding: 36px;
      border-radius: 24px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 20;
    }

    .letter-card.active {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .letter-card h2 {
      color: var(--gold);
      font-size: 1.8rem;
      margin-bottom: 14px;
    }

    .letter-card p {
      color: #cbd5e1;
      line-height: 1.7;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

  <!-- 3D Canvas -->
  <div id="webgl-container"></div>

  <!-- Arayüz -->
  <div class="ui-layer">
    <header class="interactive">
      <!-- Sürpriz Karşılama Başlığı -->
      <h1 id="main-title">Senin İçin Küçük Bir Sürpriz...</h1>
      <p class="sub" id="sub-title">Büyük an için geri sayım devam ediyor!</p>

      <div class="countdown-bar" id="countdown">
        <div class="time-box"><span class="num" id="days">00</span><span class="lbl">Gün</span></div>
        <div class="time-box"><span class="num" id="hours">00</span><span class="lbl">Saat</span></div>
        <div class="time-box"><span class="num" id="mins">00</span><span class="lbl">Dak</span></div>
        <div class="time-box"><span class="num" id="secs">00</span><span class="lbl">Sn</span></div>
      </div>
    </header>

    <footer class="interactive">
      <button class="btn-blow" id="blow-btn" disabled>Sürpriz Açıldığında Aktif Olacak!</button>
    </footer>
  </div>

  <!-- Sürpriz Mektup -->
  <div class="letter-card" id="letter">
    <h2>🎂 İYİ Kİ DOĞDUN! 🎉</h2>
    <p>
      İyiki doğdun güzelim diğer yaş günlerinde yanında olamasamda şuan yanındayım seni çok seviyorum bebeğim hep beraber nice mutlu yaşlara ❤️
    </p>
  </div>

  <script>
    // --- 1. GERİ SAYIM MANTIĞI ---
    function getTargetDate() {
      const now = new Date();
      let year = now.getFullYear();
      let target = new Date(year, 10, 9, 0, 0, 0); // 10 = Kasım
      if (now.getTime() > target.getTime() + (24 * 60 * 60 * 1000)) {
        target = new Date(year + 1, 10, 9, 0, 0, 0);
      }
      return target;
    }

    const targetDate = getTargetDate();
    let isBirthday = false;

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;
      const isToday = (now.getMonth() === 10 && now.getDate() === 9);

      if (isToday || diff <= 0) {
        isBirthday = true;
        document.getElementById('main-title').innerText = "🎂 İYİ Kİ DOĞDUN SEVGİLİM! 🎂";
        document.getElementById('sub-title').innerText = "Pastadaki mumları üfle ve dileğini tut!";
        document.getElementById('countdown').style.display = "none";
        
        const btn = document.getElementById('blow-btn');
        btn.disabled = false;
        btn.innerText = "💨 Mumları Üfle!";
        return;
      }

      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('days').innerText = String(d).padStart(2, '0');
      document.getElementById('hours').innerText = String(h).padStart(2, '0');
      document.getElementById('mins').innerText = String(m).padStart(2, '0');
      document.getElementById('secs').innerText = String(s).padStart(2, '0');
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();


    // --- 2. THREE.JS 3D SAHNE & ÇOKLU MUM EFEKTİ ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x070913, 0.05);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3.5, 7);
    camera.lookAt(0, 0.8, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Işıklar
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffe6a7, 0.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // Pastadan Genel Mum Işığı
    const mainFlameLight = new THREE.PointLight(0xff7b00, 2.5, 8);
    mainFlameLight.position.set(0, 2, 0);
    scene.add(mainFlameLight);

    // 3D Pasta Grubu
    const cakeGroup = new THREE.Group();

    // Tabak
    const plateGeo = new THREE.CylinderGeometry(2.2, 2.4, 0.1, 64);
    const plateMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1, metalness: 0.8 });
    const plate = new THREE.Mesh(plateGeo, plateMat);
    plate.position.y = -0.05;
    cakeGroup.add(plate);

    // Alt Kat
    const cakeBottomGeo = new THREE.CylinderGeometry(1.8, 1.8, 0.9, 64);
    const cakeBottomMat = new THREE.MeshStandardMaterial({ color: 0xff477e, roughness: 0.3 });
    const cakeBottom = new THREE.Mesh(cakeBottomGeo, cakeBottomMat);
    cakeBottom.position.y = 0.45;
    cakeGroup.add(cakeBottom);

    // Üst Kat (Krema)
    const cakeTopGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.7, 64);
    const cakeTopMat = new THREE.MeshStandardMaterial({ color: 0xfff0f5, roughness: 0.2 });
    const cakeTop = new THREE.Mesh(cakeTopGeo, cakeTopMat);
    cakeTop.position.y = 1.25;
    cakeGroup.add(cakeTop);

    // 3 TANE MUM VE ALEV DİZİSİ
    const candlesData = [];
    const candlePositions = [
      { x: -0.35, z: 0 },
      { x: 0, z: 0.25 },
      { x: 0.35, z: 0 }
    ];

    candlePositions.forEach(pos => {
      // Mum Gövdesi
      const candleGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.45, 32);
      const candleMat = new THREE.MeshStandardMaterial({ color: 0x3a86ff });
      const candleMesh = new THREE.Mesh(candleGeo, candleMat);
      candleMesh.position.set(pos.x, 1.82, pos.z);
      cakeGroup.add(candleMesh);

      // Mum Alevi
      const flameGeo = new THREE.SphereGeometry(0.07, 16, 16);
      flameGeo.scale(1, 2.2, 1);
      const flameMat = new THREE.MeshBasicMaterial({ color: 0xffb703 });
      const flameMesh = new THREE.Mesh(flameGeo, flameMat);
      flameMesh.position.set(pos.x, 2.12, pos.z);
      cakeGroup.add(flameMesh);

      candlesData.push({ flame: flameMesh, pos: pos });
    });

    // Yıldızlar
    const particlesGeo = new THREE.BufferGeometry();
    const particleCount = 200;
    const posArray = new Float32Array(particleCount * 3);
    for(let i=0; i<particleCount*3; i++) {
      posArray[i] = (Math.random() - 0.5) * 15;
    }
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMat = new THREE.PointsMaterial({ size: 0.03, color: 0xffbe0b, transparent: true, opacity: 0.8 });
    const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
    scene.add(particlesMesh);

    scene.add(cakeGroup);

    // Duman Efekti
    let smokeParticles = [];
    let isBlown = false;

    function createSmokeForCandles() {
      candlesData.forEach(c => {
        for(let i=0; i<10; i++) {
          const geo = new THREE.SphereGeometry(0.03 + Math.random()*0.02, 8, 8);
          const mat = new THREE.MeshBasicMaterial({ color: 0xcccccc, transparent: true, opacity: 0.6 });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(c.pos.x, 2.1, c.pos.z);
          mesh.userData = {
            vx: (Math.random() - 0.5) * 0.01,
            vy: 0.015 + Math.random() * 0.01,
            vz: (Math.random() - 0.5) * 0.01,
            life: 1.0
          };
          smokeParticles.push(mesh);
          scene.add(mesh);
        }
      });
    }

    // Fare Takibi
    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 0.8;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 0.5;
    });

    // Animasyon Döngüsü
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      cakeGroup.rotation.y = elapsedTime * 0.3 + mouseX;
      cakeGroup.rotation.x = mouseY * 0.2;

      // Alevlerin Canlı Titremesi
      if (!isBlown) {
        candlesData.forEach((c, idx) => {
          c.flame.scale.x = 1 + Math.sin(elapsedTime * 12 + idx) * 0.1;
          c.flame.scale.z = 1 + Math.cos(elapsedTime * 10 + idx) * 0.1;
        });
        mainFlameLight.intensity = 2.5 + Math.sin(elapsedTime * 15) * 0.5;
      }

      // Duman Hareketi
      smokeParticles.forEach((p, index) => {
        p.position.x += p.userData.vx;
        p.position.y += p.userData.vy;
        p.position.z += p.userData.vz;
        p.userData.life -= 0.01;
        p.material.opacity = p.userData.life * 0.6;
        if(p.userData.life <= 0) {
          scene.remove(p);
          smokeParticles.splice(index, 1);
        }
      });

      particlesMesh.rotation.y = elapsedTime * 0.05;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });


    // --- 3. MUM SÖNDÜRME VE MEKTUP ---
    const blowBtn = document.getElementById('blow-btn');
    const letterCard = document.getElementById('letter');

    function blowOutCandle() {
      if (isBlown) return;
      isBlown = true;

      // Tüm Alevleri Söndür ve Duman Çıkar
      candlesData.forEach(c => c.flame.visible = false);
      mainFlameLight.intensity = 0;
      createSmokeForCandles();

      // Butonu Gizle, Mektubu Aç
      blowBtn.style.display = 'none';
      letterCard.classList.add('active');

      // Konfeti Patlaması
      confetti({
        particleCount: 180,
        spread: 100,
        origin: { y: 0.6 },
        colors: ['#ff477e', '#ffb703', '#3a86ff', '#ffffff']
      });
    }

    blowBtn.addEventListener('click', blowOutCandle);
  </script>
</body>
</html>
